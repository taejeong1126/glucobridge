<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net"
        />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>CareSens Connect</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
        <style>
            :root {
                --background: #f8fafc;
                --foreground: #0f172a;
                --muted: #64748b;
                --border: #cbd5e1;
                --primary: #2563eb;
                --primary-hover: #1d4ed8;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--background);
                color: var(--foreground);
                font-family: Pretendard, 'Malgun Gothic', sans-serif;
            }
            main {
                width: 100%;
                height: 100vh;
                padding: 20px 22px;
            }
            section {
                height: 100%;
            }
            h1 {
                margin: 0 0 8px;
                font-size: 22px;
                font-weight: 650;
                letter-spacing: -0.4px;
            }
            p {
                margin: 0;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.45;
            }
            button {
                appearance: none;
                border: 0;
                border-radius: 6px;
                background: var(--primary);
                color: white;
                box-shadow: none;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
            button:hover {
                background: var(--primary-hover);
            }
            button:focus-visible,
            textarea:focus-visible {
                outline: 2px solid #93c5fd;
                outline-offset: 2px;
            }
            button:disabled {
                opacity: 0.55;
                cursor: default;
            }
            #login-screen {
                display: flex;
                flex-direction: column;
                text-align: center;
            }
            #login-screen .intro {
                margin: auto 0;
            }
            #login {
                width: 100%;
                min-height: 46px;
                font-size: 16px;
            }
            #config-screen {
                display: grid;
                grid-template-rows: auto minmax(0, 1.25fr) minmax(0, 0.95fr) auto;
                gap: 14px;
            }
            .config-heading {
                text-align: left;
            }
            .config-heading p {
                font-size: 13px;
            }
            .env-item {
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .env-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                margin-bottom: 6px;
            }
            label {
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0;
            }
            .env-heading button {
                min-width: 62px;
                min-height: 30px;
                padding: 5px 10px;
                font-size: 13px;
            }
            textarea {
                appearance: none;
                display: block;
                width: 100%;
                min-height: 0;
                flex: 1;
                padding: 9px 11px;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: #fff;
                color: var(--foreground);
                box-shadow: none;
                font:
                    12px/1.4 Consolas,
                    monospace;
                overflow-wrap: anywhere;
                resize: none;
                scrollbar-width: thin;
                scrollbar-color: #cbd5e1 transparent;
            }
            #notice {
                min-height: 18px;
                color: var(--muted);
                font-size: 12px;
            }
            #error {
                position: absolute;
                right: 24px;
                bottom: 74px;
                left: 24px;
                color: #b42318;
                font-size: 13px;
                text-align: center;
            }
            [hidden] {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <main>
            <section id="login-screen">
                <div class="intro">
                    <h1>CareSens 로그인</h1>
                    <p>계정에 로그인해 설정을 시작하세요.</p>
                </div>
                <button id="login">로그인</button>
            </section>
            <section id="config-screen" hidden>
                <div class="config-heading">
                    <h1>Vercel 환경변수</h1>
                    <p>아래 이름으로 변수를 만들고 값을 붙여 넣으세요.</p>
                </div>
                <div class="env-item">
                    <div class="env-heading">
                        <label for="session-value">CARESENS_SESSION_B64</label>
                        <button id="copy-session">복사</button>
                    </div>
                    <textarea id="session-value" readonly spellcheck="false"></textarea>
                </div>
                <div class="env-item">
                    <div class="env-heading">
                        <label for="secret-value">CARESENS_ROUTE_SECRET</label>
                        <button id="copy-secret">복사</button>
                    </div>
                    <textarea id="secret-value" readonly spellcheck="false"></textarea>
                </div>
                <p id="notice" aria-live="polite"></p>
            </section>
            <p id="error" role="alert" hidden></p>
        </main>
        <script src="renderer.js"></script>
    </body>
</html>
