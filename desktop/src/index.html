<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'"
        />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>CareSens Connect</title>
        <style>
            :root {
                color-scheme: light;
                font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
                background: #f8fafc;
                color: #0f172a;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
            }
            main {
                display: flex;
                flex-direction: column;
                height: 100vh;
                padding: 24px;
            }
            h1 {
                margin: 0 0 10px;
                font-size: 22px;
            }
            p {
                margin: 0;
                color: #475569;
                line-height: 1.55;
                font-size: 13px;
            }
            #login-screen {
                display: flex;
                flex: 1;
                flex-direction: column;
            }
            .intro {
                margin: auto 0;
                text-align: center;
            }
            button {
                border: 0;
                border-radius: 8px;
                background: #2563eb;
                color: white;
                font: inherit;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                padding: 11px 14px;
            }
            button:focus-visible {
                outline: 2px solid #1e40af;
                outline-offset: 3px;
            }
            button:disabled {
                opacity: 0.55;
                cursor: default;
            }
            #login {
                width: 100%;
            }
            #config-screen {
                flex: 1;
            }
            .variable {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                padding: 13px 0;
                border-bottom: 1px solid #cbd5e1;
            }
            .variable strong {
                font:
                    600 12px Consolas,
                    monospace;
                overflow-wrap: anywhere;
            }
            .variable button {
                flex-shrink: 0;
                padding: 9px 12px;
                font-size: 12px;
            }
            .hint {
                margin-top: 14px;
                font-size: 12px;
            }
            #notice {
                margin-top: 12px;
                color: #1e40af;
                min-height: 18px;
            }
            #error {
                margin-top: 12px;
                color: #b42318;
            }
            [hidden] {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <main>
            <section id="login-screen">
                <div class="intro">
                    <h1>CareSens Connect</h1>
                    <p>CareSens 계정으로 로그인해<br />MCP 연결에 필요한 환경변수를 준비합니다.</p>
                </div>
                <button id="login">CareSens 로그인</button>
            </section>
            <section id="config-screen" hidden>
                <h1>Vercel 환경변수</h1>
                <p>각 값을 복사해 Vercel 프로젝트의 Environment Variables에 등록하세요.</p>
                <div class="variable">
                    <strong>CARESENS_SESSION_B64</strong>
                    <button id="copy-session" aria-label="CareSens 세션 값 복사">값 복사</button>
                </div>
                <div class="variable">
                    <strong>CARESENS_ROUTE_SECRET</strong>
                    <button id="copy-secret" aria-label="MCP 비밀키 복사">값 복사</button>
                </div>
                <p class="hint">복사한 값과 비밀 URL을 타인에게 전달하지 마세요.</p>
                <p id="notice" aria-live="polite"></p>
            </section>
            <p id="error" role="alert" hidden></p>
        </main>
        <script src="renderer.js"></script>
    </body>
</html>
